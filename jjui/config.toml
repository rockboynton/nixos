[ui.tracer]
enabled = true

[preview]
revision_command = [
  "show",
  "--color",
  "always",
  "-r",
  "$change_id",
  "--config",
  "ui.diff-formatter=neohelix-inline",
]
show_at_start = true

# Shift-E uses jjui's built-in interactive diff-edit action. JJ's ui.diff-editor
# selects Neohelix; exiting Helix returns to jjui and refreshes the revision.
