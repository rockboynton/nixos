"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_orange)\
$os\
$username\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_aqua)\
${custom.jj}\
[](fg:color_aqua bg:color_blue)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_blue bg:color_bg3)\
$nix_shell\
[](fg:color_bg3 bg:color_bg1)\
$time\
$cmd_duration\
[ ](fg:color_bg1)\
$line_break$character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#ebdbb2'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[os]
disabled = false
style = "bg:color_orange fg:color_fg0"

[os.symbols]
Macos = "󰀵"
NixOS = ""

[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[c]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[rust]
symbol = "󱘗"
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[haskell]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[nix_shell]
symbol = "󱄅"
style = "bg:color_bg3"
format = '[[ $symbol $state( \($name\))](fg:#83a598 bg:color_bg3)]($style)'
heuristic = true

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'

[cmd_duration]
style = "bg:color_bg1"
format = '[[ took $duration ](fg:color_yellow bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[󱞪](bold fg:color_green)'
error_symbol = '[󱞪](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_yellow)'
vimcmd_replace_symbol = '[](bold fg:color_orange)'
vimcmd_visual_symbol = '[](bold fg:color_purple)'

[custom.jj]
style = "fg:color_fg0 bg:color_aqua"
format = '[ $output ]($style)'
when = "jj-starship detect"
shell = ["bash", "--noprofile", "--norc"]
command = '''
E=$(printf '\033')
REASSERT="${E}[0m${E}[48;2;104;157;106m${E}[38;2;235;219;178m"
printf '%s' "${E}[48;2;104;157;106m${E}[38;2;235;219;178m"
jj-starship --no-jj-prefix --no-git-prefix \
    | sed -E \
        -e "s/${E}\[95m/${E}[1m/g" \
        -e "s/${E}\[(90|32)m//g" \
        -e "s/${E}\[0m/${REASSERT}/g"
'''
