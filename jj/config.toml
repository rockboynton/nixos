"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
name = "Rock Boynton"
email = "rock.boynton@yahoo.com"

# work machine
[[--scope]]
--when.hostnames = ["MAC-DF7961R9X9"]
[--scope.user]
email = "rboynton@anduril.com"

# Open-source work and this personal config repo stay on the personal email everywhere
# On non-work hosts this just reaffirms the default
[[--scope]]
--when.repositories = ["~/sources/oss", "~/sources/nixos"]
[--scope.user]
email = "rock.boynton@yahoo.com"

[ui]
default-command = "log"
merge-editor = "mergiraf"
diff-formatter = "neohelix"
diff-editor = "neohelix"
# Neohelix has its own review UI; omit JJ's synthetic instruction file.
diff-instructions = false

[merge-tools.neohelix]
program = "hx"
# Preserve the workspace for Neohelix configuration and reusable diff workers.
diff-do-chdir = false
diff-args = [
  "--render-diff",
  "--color",
  "always",
  "--width",
  "$width",
  "$left",
  "$right",
]
diff-invocation-mode = "dir"
edit-args = ["--review", "--diff-layout", "inline", "$left", "$right"]
edit-invocation-mode = "dir"

[merge-tools.neohelix-inline]
program = "hx"
diff-do-chdir = false
diff-args = [
  "--render-diff",
  "--diff-layout",
  "inline",
  "--color",
  "always",
  "--width",
  "$width",
  "$left",
  "$right",
]
diff-invocation-mode = "dir"

[merge-tools.delta]
diff-expected-exit-codes = [0, 1]
diff-args = ["--width=$width", "$left", "$right"]

[merge-tools.delta-side-by-side]
program = "delta"
diff-expected-exit-codes = [0, 1]
diff-args = ["--side-by-side", "$left", "$right", "--width=$width"]

[merge-tools.difft]
diff-args = ["--color=always", "$left", "$right"]

[revsets]
bookmark-advance-to = "@-"

[revset-aliases]
# Megamerge workflow: https://isaaccorbrey.com/notes/jujutsu-megamerges-for-fun-and-profit
"closest_merge(to)" = "heads(::to & merges())"
# The megamerge is the newest ancestor of @ described exactly "megamerge".
"megamerge()" = "heads(::@ & subject(exact:'megamerge'))"
# Mutable commits outside the megamerge, its branches, and the work above it.
"stale()" = "mutable() & ~::megamerge() & ~megamerge()::"

[aliases]
tug = ["bookmark", "advance"]
push = ["git", "push"]
fetch = ["git", "fetch"]
# Move the given revisions between trunk and the megamerge.
stack = ["rebase", "--after", "trunk()", "--before", "closest_merge(@)", "--revision"]
# Stack everything after the megamerge, skipping empty commits.
stage = ["stack", "closest_merge(@)+:: ~ empty()"]
# Rebase all mutable work onto trunk.
restack = ["rebase", "--onto", "trunk()", "--source", "roots(trunk()..) & mutable()", "--simplify-parents"]

[remotes.origin]
auto-track-bookmarks = 'glob:"rboynton/*" | glob:"rockboynton/*"'

[snapshot]
auto-update-stale = true
