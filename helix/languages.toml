# [language-server.harper-ls.config.harper-ls]
# diagnosticSeverity = "warn"
# linters.ToDoHyphen = false

[language-server.haskell-language-server]
command = "haskell-language-server"
args = ["--lsp"]

[language-server.rust-analyzer.config]
cargo.targetDir = true
check.command = "clippy"
workspace.symbol.search.kind = "all_symbols"

[language-server.tinymist.config]
exportPdf = "onType"
outputPath = "$root/target/$dir/$name"
lint.enabled = true
lint.when = "onType"
formatterMode = "typstyle"
formatterProseWrap = true
# Resolve the document to compile from a `tinymist.lock` at the project root instead of from whichever
# file happens to be focused. Without this, opening an imported module makes that module the compile
# entry, and the real document's PDF stops updating. Generate the lock with:
#   tinymist compile --save-lock --when onType path/to/main.typ
projectResolution = "lockDatabase"

[language-server.rumdl]
command = "rumdl"
args = ["server"]

[[language]]
name = "haskell"
indent = { tab-width = 4, unit = "    " }
formatter = { command = "fourmolu", args = ["-i"] }

[[language]]
name = "ld"
file-types = ["ld", "x"]

[[language]]
name = "markdown"
formatter = { command = "rumdl", args = ["fmt", "-"] }
language-servers = ["rumdl"]

[[language]]
name = "nix"
language-servers = ["nixd"]
formatter = { command = "nixpkgs-fmt" }

[[language]]
name = "rust"
language-servers = ["rust-analyzer"]
# language-servers = ["rust-analyzer", "harper-ls"]

[[language]]
name = "toml"
formatter = { command = "taplo", args = ["fmt", "-"] }

[[language]]
name = "typst"
auto-format = true
language-servers = ["tinymist"]
formatter = { command = "typstyle", args = ["--wrap-text", "--line-width=120"] }
