theme = "modified_gruvbox" # modified to make background transparent, that's it

[editor]
mouse = false
true-color = true
line-number = "relative"
rulers = [120]
color-modes = true
text-width = 120
cursorline = true
shell = ["fish", "-c"]
jump-label-alphabet = "asdf;lkjghqweruioptyzxc/.,mbn"
bufferline = "multiple"
completion-trigger-len = 1
completion-timeout = 100
undercurl = true
end-of-line-diagnostics = "hint"
rainbow-brackets = true
file-picker.hidden = false

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.auto-save]
focus-lost = true
after-delay.enable = true
after-delay.timeout = 300

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
center = ["diagnostics", "spacer", "workspace-diagnostics"]
right = [
  "selections",
  "register",
  "position",
  "position-percentage",
  "file-encoding",
]

[editor.statusline.mode]
normal = "NORMAL"
insert = "INSERT"
select = "SELECT"

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.whitespace.render]
space = "all"
tab = "all"

[editor.indent-guides]
render = true
skip-levels = 1
character = "┊"

[keys.normal]
tab = "move_parent_node_end"
S-tab = "move_parent_node_start"
C-u = ["page_cursor_half_up", "align_view_center"]
C-d = ["page_cursor_half_down", "align_view_center"]
A-y = [":yank-join"]
A-o = "jump_backward"
A-i = "jump_forward"
A-c = "copy_selection_on_prev_line"
A-H = "goto_previous_buffer"
A-L = "goto_next_buffer"
"}" = "goto_next_paragraph"
"{" = "goto_prev_paragraph"
X = "extend_line_above"
D = ["move_char_left", "delete_selection"]
H = "jump_view_left"
L = "jump_view_right"
A-f = ":format"
A-r = ":reload-all"
A-R = ":reflow"
A-W = "move_next_sub_word_start"
A-B = "move_prev_sub_word_start"
A-E = "move_next_sub_word_end"
ret = "goto_word"
C-S = "save_selection"

[keys.normal.space]
x = ":buffer-close"
X = ":buffer-close-others"
A-f = "file_picker_in_current_buffer_directory"
A-y = ":clipboard-yank-join"
"." = ":toggle-option file-picker.git-ignore"
n = ":new"
l = ":lsp-restart"
q = ":quit-all"
i = ":toggle lsp.display-inlay-hints"
t = ":toggle soft-wrap.enable"

[keys.normal."'"]
y = [
  ':sh rm -f /tmp/unique-ca1ea106',
  ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/unique-ca1ea106',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-ca1ea106}',
  ':redraw',
  ':set mouse false',
  ':set mouse true',
]
r = ":reset-diff-change"
g.t = [
  ":sh zellij run --floating -x 5%% -y 6%% --height 88%% --width 91%% --close-on-exit -- jjui",
  ":reload-all",
]
g.b = ":sh zellij run --floating -x 5%% -y 6%% --height 88%% --width 91%% -n 'Annotate' -- jj file annotate '%{buffer_name}'"
g.u = ":sh gh browse -n '%{buffer_name}:%{selection_line_start}-%{selection_line_end}' | pbcopy"
g.o = ":sh gh browse '%{buffer_name}:%{selection_line_start}-%{selection_line_end}'"
g.d.i = ":sh zellij run --floating -x 5%% -y 6%% --height 88%% --width 91%% -n 'Diff (Inline)' -- jj diff --tool delta"
g.d.s = ":sh zellij run --floating -x 5%% -y 6%% --height 88%% --width 91%% -n 'Diff (Split)' -- jj diff"
g.c = ":sh zellij action write-chars '/<<<<<<<' && zellij action write 13"
"'" = ":sh zellij action new-pane --floating -x 5% -y 6% --height 88% --width 91%"

[keys.insert]
S-tab = "move_parent_node_start"
A-left = "move_prev_word_start"
A-right = ["move_next_word_end", "move_char_right"]
C-left = "move_prev_word_start"
C-right = ["move_next_word_end", "move_char_right"]
A-p = "command_palette"

[keys.select]
tab = "extend_parent_node_end"
S-tab = "extend_parent_node_start"
X = "select_line_above"
A-W = "extend_next_sub_word_start"
A-B = "extend_prev_sub_word_start"
A-E = "extend_next_sub_word_end"
